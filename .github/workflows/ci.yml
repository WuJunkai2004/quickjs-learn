name: ci

on:
  pull_request:
    paths:
      - '**'
      - '!.gitignore'
      - '!LICENSE'
      - '!TODO'
      - '!doc/**'
      - '!examples/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - '*'

jobs:
  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(getconf _NPROCESSORS_ONLN)
      - name: Stats
        run: |
          ./build/qjs -qd
      - name: Run tests (ctest 9 test files + microbench)
        run: |
          ctest --test-dir build --output-on-failure

  linux-nolto:
    # 拆分为多编译单元后，LTO 负责跨模块内联；此 job 验证关闭 LTO 仍可构建且测试全过
    name: Linux (no LTO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
          cmake --build build -j$(getconf _NPROCESSORS_ONLN)
      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure

  linux-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          cmake --build build -j$(getconf _NPROCESSORS_ONLN)
      - name: Run tests
        env:
          ASAN_OPTIONS: halt_on_error=1
        run: |
          ctest --test-dir build --output-on-failure -E microbench

  linux-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined"
          cmake --build build -j$(getconf _NPROCESSORS_ONLN)
      - name: Run tests
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          ctest --test-dir build --output-on-failure -E microbench

  linux-msan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          CC: clang
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=memory -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=memory"
          cmake --build build -j$(getconf _NPROCESSORS_ONLN)
      - name: Run tests
        env:
          MSAN_OPTIONS: halt_on_error=1
        run: |
          ctest --test-dir build --output-on-failure -E microbench

  linux-32bit:
    name: Linux 32bit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gcc-multilib
        run: |
          sudo apt update
          sudo apt install -y gcc-multilib
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-m32" \
            -DCMAKE_EXE_LINKER_FLAGS="-m32"
          cmake --build build -j$(getconf _NPROCESSORS_ONLN)
      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(getconf _NPROCESSORS_ONLN)
      - name: Stats
        run: |
          ./build/qjs -qd
      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure

  test262:
    name: Linux test262 conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap test262 suite
        # 版本固定（原 Makefile TEST262_COMMIT），与 ecma262/test262_errors.txt 基线对齐
        run: |
          git clone --single-branch --shallow-since=2025-09-01 https://github.com/tc39/test262.git ecma262/test262
          cd ecma262/test262 && git checkout -q 5c8206929d81b2d3d727ca6aac56c18358c8d790 && patch -p1 < ../../ecma262/test262.patch
      - name: Build run-test262
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target run-test262 -j$(getconf _NPROCESSORS_ONLN)
      - name: Run test262
        # 退出码非 0 即出现 new/changed/fixed（相对 ecma262/test262_errors.txt 的回归）
        # 必须在 ecma262/ 内以裸文件名引用 conf：测试名由 conf 相对路径 + CWD 拼出。
        # 若从仓库根用 -c ecma262/test262.conf 运行，测试名会带上 ecma262/ 前缀，
        # 与 test262_errors.txt 里的 test262/test/... 条目失配，已知错误会全部误报为 new。
        run: |
          cd ecma262 && ../build/run-test262 -t -m -c test262.conf -a
